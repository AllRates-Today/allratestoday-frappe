[project]
name = "allratestoday"
authors = [
    { name = "AllRatesToday", email = "support@allratestoday.com" }
]
description = "Load official exchange rates (RBI/FBIL, CBIC customs, Indian bank TT cards, ECB, 120+ central banks) or live market rates into ERPNext Currency Exchange"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://allratestoday.com/exchange-rate-api-india/"
Documentation = "https://allratestoday.com/migrate/erpnext/"
Source = "https://github.com/AllRates-Today/allratestoday-frappe"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<16.0.0"
erpnext = ">=14.0.0,<16.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
